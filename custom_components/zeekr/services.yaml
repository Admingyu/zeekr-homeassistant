get_monthly_statistics:
  name: Get monthly statistics
  description: Return the monthly journey statistics for one Zeekr vehicle.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}
    year_month:
      name: Month
      required: true
      description: Month in YYYY-MM format.
      selector:
        text: {}
    account_id:
      name: Account ID
      required: true
      selector:
        text: {}

get_app_messages:
  name: Get app messages
  description: Return app upgrade messages for one Zeekr vehicle.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}

find_vehicle:
  name: Find vehicle
  description: Flash the horn and lights so the vehicle can be located.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}

lock_doors:
  name: Lock doors
  description: Lock every door on the vehicle.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}

unlock_doors:
  name: Unlock doors
  description: Unlock every door on the vehicle.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}

set_climate:
  name: Set climate
  description: Start air conditioning with a target temperature and run time, or stop it.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}
    enabled:
      name: Start climate
      description: Turn on air conditioning. Clear it to turn it off.
      required: true
      default: true
      selector:
        boolean: {}
    temperature:
      name: Temperature
      description: Target temperature in °C. Ignored when starting is disabled.
      required: false
      default: 22
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider
    duration:
      name: Duration
      description: Run time in minutes. Ignored when starting is disabled.
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: min

set_seat_heating:
  name: Set seat heating
  description: Start driver-seat heating with a level and run time, or stop it.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}
    enabled:
      name: Start heating
      description: Turn on seat heating. Clear it to turn it off.
      required: true
      default: true
      selector:
        boolean: {}
    level:
      name: Level
      description: Heat level from 1 to 3. Ignored when starting is disabled.
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: slider
    duration:
      name: Duration
      description: Run time in minutes. Ignored when starting is disabled.
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 15
          step: 1
          unit_of_measurement: min

set_steering_wheel_heating:
  name: Set steering-wheel heating
  description: Start steering-wheel heating with a level and run time, or stop it.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}
    enabled:
      name: Start heating
      description: Turn on steering-wheel heating. Clear it to turn it off.
      required: true
      default: true
      selector:
        boolean: {}
    level:
      name: Level
      description: Heat level from 1 to 3. Ignored when starting is disabled.
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: slider
    duration:
      name: Duration
      description: Run time in minutes. Ignored when starting is disabled.
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 15
          step: 1
          unit_of_measurement: min

remote_control:
  name: Send raw remote control
  description: Send an unmodelled remote-control command to one Zeekr vehicle.
  fields:
    vin:
      name: Vehicle VIN
      required: true
      selector:
        text: {}
    service_id:
      name: Service ID
      description: App service identifier such as ZAF, RDL, RDU, RHL, or RSM.
      required: true
      example: ZAF
      selector:
        text: {}
    command:
      name: Command
      description: Command verb the service expects, usually start or stop.
      required: false
      default: start
      selector:
        text: {}
    parameters:
      name: Service parameters
      description: Mapping of app service-parameter keys to values.
      required: false
      example:
        AC: "true"
        AC.temp: "22.0"
        AC.duration: "15"
      selector:
        object: {}
